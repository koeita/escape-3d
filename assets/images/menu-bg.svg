<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Room Atmosphere Gradients -->
    <radialGradient id="roomAtmosphere" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#161b26" />
      <stop offset="35%" stop-color="#0f121a" />
      <stop offset="65%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#040406" />
    </radialGradient>

    <!-- God Rays / Moonlight from Cathedral Windows -->
    <linearGradient id="godRayCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8ab4f8" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#4a6fa5" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="godRayLeft" x1="40%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#7a6220" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="godRayRight" x1="60%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#69c5ff" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#1b4d80" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Celestial Gold Gradients -->
    <linearGradient id="goldGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1a9" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#c69226" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8a5e0d" stop-opacity="0.35" />
    </linearGradient>

    <!-- Vignette Mask -->
    <radialGradient id="menuVignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Room Darkness -->
  <rect width="1920" height="1080" fill="url(#roomAtmosphere)" />

  <!-- 3D Perspective Architecture of the Ancient Escape Chamber -->
  <g stroke="#3a4860" stroke-opacity="0.2" stroke-width="1.5">
    <!-- Ceiling Vault Arches -->
    <path d="M 0,0 L 720,320 L 1200,320 L 1920,0" fill="none" />
    <path d="M 720,320 L 720,0" stroke-opacity="0.12" />
    <path d="M 1200,320 L 1200,0" stroke-opacity="0.12" />
    <path d="M 960,320 L 960,0" stroke-opacity="0.15" stroke-dasharray="8 8" />

    <!-- Floor Perspective Lines -->
    <line x1="0" y1="1080" x2="680" y2="740" />
    <line x1="1920" y1="1080" x2="1240" y2="740" />
    <line x1="420" y1="1080" x2="820" y2="740" />
    <line x1="1500" y1="1080" x2="1100" y2="740" />
    
    <!-- Chamber Back Wall -->
    <rect x="680" y="320" width="560" height="420" fill="#0b0e14" stroke="#4a5b78" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- Great Escape Vault Arch on Back Wall -->
    <path d="M 780,740 L 780,480 A 180,180 0 0,1 1140,480 L 1140,740" fill="#07090d" stroke="#c89b3c" stroke-opacity="0.28" stroke-width="2.5" />
    <path d="M 820,740 L 820,510 A 140,140 0 0,1 1100,510 L 1100,740" fill="none" stroke="#7a6220" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- Mystical Celestial Zodiac & Astrolabe Chart -->
  <g transform="translate(960, 520)" filter="url(#softGlow)">
    <!-- Outer Orbit Ring -->
    <circle r="380" fill="none" stroke="url(#goldGlowGrad)" stroke-width="2" stroke-dasharray="8 16" />
    <circle r="360" fill="none" stroke="#8ab4f8" stroke-opacity="0.1" stroke-width="1.2" />

    <!-- Sacred Geometry Stars -->
    <polygon points="0,-300 260,-150 260,150 0,300 -260,150 -260,-150" fill="none" stroke="#e5b84c" stroke-opacity="0.12" stroke-width="1.5" />
    <polygon points="0,300 260,150 260,-150 0,-300 -260,-150 -260,150" fill="none" stroke="#6ca8e8" stroke-opacity="0.1" stroke-width="1.5" />

    <!-- Mid Rings -->
    <circle r="230" fill="none" stroke="url(#goldGlowGrad)" stroke-width="2.2" />
    <circle r="210" fill="none" stroke="#e5b84c" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="4 8" />

    <!-- 12 Astrological Hour Marks -->
    <g stroke="#c89b3c" stroke-opacity="0.15" stroke-width="1.5">
      <line x1="0" y1="-230" x2="0" y2="-190" />
      <line x1="0" y1="190" x2="0" y2="230" />
      <line x1="-230" y1="0" x2="-190" y2="0" />
      <line x1="190" y1="0" x2="230" y2="0" />
      <line x1="-162" y1="-162" x2="-134" y2="-134" />
      <line x1="134" y1="134" x2="162" y2="162" />
      <line x1="162" y1="-162" x2="134" y2="-134" />
      <line x1="-134" y1="134" x2="-162" y2="162" />
    </g>

    <!-- Center Key Hole / Seal -->
    <circle r="130" fill="#090c12" stroke="url(#goldGlowGrad)" stroke-width="2.5" />
    <circle r="95" fill="none" stroke="#8ab4f8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 6" />

    <!-- Subtle Golden Key Silhouette in Center -->
    <g transform="rotate(45) scale(0.65)" opacity="0.35">
      <circle cx="0" cy="-60" r="32" fill="none" stroke="#fce69a" stroke-width="6" />
      <line x1="0" y1="-28" x2="0" y2="70" stroke="#fce69a" stroke-width="8" stroke-linecap="round" />
      <rect x="0" y="40" width="22" height="10" fill="#fce69a" rx="2" />
      <rect x="0" y="55" width="16" height="10" fill="#fce69a" rx="2" />
    </g>
  </g>

  <!-- Atmospheric Light Shafts (God Rays pouring into the room) -->
  <polygon points="880,0 1040,0 1340,1080 580,1080" fill="url(#godRayCenter)" />
  <polygon points="680,0 760,0 350,1080 0,1080" fill="url(#godRayLeft)" />
  <polygon points="1160,0 1240,0 1920,1080 1570,1080" fill="url(#godRayRight)" />

  <!-- Full Frame Vignette (Frames the Menu Screen perfectly) -->
  <rect width="1920" height="1080" fill="url(#menuVignette)" />
</svg>
