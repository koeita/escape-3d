<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22" />
      <stop offset="50%" stop-color="#141519" />
      <stop offset="100%" stop-color="#0e0f12" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4d56" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2a2c33" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#15161a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldBowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1a9" />
      <stop offset="25%" stop-color="#e5b84c" />
      <stop offset="50%" stop-color="#c69226" />
      <stop offset="75%" stop-color="#f3d778" />
      <stop offset="100%" stop-color="#996a13" />
    </linearGradient>
    <linearGradient id="goldShaftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5e10" />
      <stop offset="30%" stop-color="#e2b547" />
      <stop offset="50%" stop-color="#fff1aa" />
      <stop offset="75%" stop-color="#d49e2b" />
      <stop offset="100%" stop-color="#7a5009" />
    </linearGradient>
    <linearGradient id="goldSpokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6df8a" />
      <stop offset="100%" stop-color="#a8761d" />
    </linearGradient>

    <!-- Jewel Gradients -->
    <radialGradient id="sapphireGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#69c5ff" />
      <stop offset="20%" stop-color="#2b93e8" />
      <stop offset="55%" stop-color="#1366c0" />
      <stop offset="85%" stop-color="#0a438c" />
      <stop offset="100%" stop-color="#05285e" />
    </radialGradient>
    <radialGradient id="jewelInnerGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="keyShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="jewelShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Stitching Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#686252" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="8 6" />

  <!-- Inner Subtle Bevel -->
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Golden Key with Shadow -->
  <g filter="url(#keyShadow)">
    <!-- Key Transformation Group: Rotated 45 degrees around center -->
    <g transform="translate(180, 180) rotate(45)">

      <!-- Key Shaft -->
      <!-- Shaft extends from bow (y=0) down to y=210 -->
      <path d="M -9,30 L 9,30 L 9,215 A 9,9 0 0,1 -9,215 Z" fill="url(#goldShaftGrad)" />
      
      <!-- Shaft Ring / Tip Accent (the small loop at the very bottom) -->
      <circle cx="0" cy="225" r="14" fill="url(#goldBowGrad)" />
      <circle cx="0" cy="225" r="6" fill="#141519" />

      <!-- Key Bit (Teeth) on the right side -->
      <g fill="url(#goldBowGrad)">
        <!-- Tooth 1 -->
        <rect x="7" y="145" width="28" height="15" rx="3" />
        <!-- Tooth 2 -->
        <rect x="7" y="172" width="22" height="15" rx="3" />
        <!-- Bit cutouts/notches for antique detail -->
        <path d="M 27,145 L 35,145 L 35,160 L 27,160 Z" fill="url(#goldShaftGrad)" />
        <path d="M 22,172 L 29,172 L 29,187 L 22,187 Z" fill="url(#goldShaftGrad)" />
      </g>

      <!-- Key Bow (Outer Ring) -->
      <circle cx="0" cy="0" r="68" fill="url(#goldBowGrad)" stroke="#80560a" stroke-width="2" />
      <circle cx="0" cy="0" r="50" fill="#141519" />

      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldBowGrad)" stroke-width="6" />

      <!-- Cross Spokes -->
      <!-- Vertical Spoke -->
      <rect x="-4" y="-68" width="8" height="136" rx="2" fill="url(#goldSpokeGrad)" />
      <!-- Horizontal Spoke -->
      <rect x="-68" y="-4" width="136" height="8" rx="2" fill="url(#goldSpokeGrad)" />

      <!-- Center Gem Bezel / Setting -->
      <circle cx="0" cy="0" r="32" fill="url(#goldBowGrad)" stroke="#664405" stroke-width="2" />

      <!-- Sapphire Cabochon Gem -->
      <circle cx="0" cy="0" r="26" fill="url(#sapphireGrad)" filter="url(#jewelShadow)" />
      
      <!-- Gem Highlight (Glossy Reflection) -->
      <ellipse cx="-8" cy="-8" rx="10" ry="7" transform="rotate(-30 -8 -8)" fill="url(#jewelInnerGlow)" />
      <circle cx="-10" cy="-10" r="3.5" fill="#ffffff" fill-opacity="0.8" />
      
      <!-- Gem Subtle Rim Reflection -->
      <path d="M -16,14 A 23,23 0 0,0 18,14" fill="none" stroke="#69c5ff" stroke-opacity="0.3" stroke-width="2" />

    </g>
  </g>
</svg>
