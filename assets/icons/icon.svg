<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2027" />
      <stop offset="50%" stop-color="#131418" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#606470" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#2d3038" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#141518" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldBowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8" />
      <stop offset="25%" stop-color="#e8be52" />
      <stop offset="50%" stop-color="#c69226" />
      <stop offset="75%" stop-color="#f5dc80" />
      <stop offset="100%" stop-color="#8a5e0d" />
    </linearGradient>
    <linearGradient id="goldShaftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5009" />
      <stop offset="25%" stop-color="#d49e2b" />
      <stop offset="50%" stop-color="#fff5bd" />
      <stop offset="75%" stop-color="#e2b547" />
      <stop offset="100%" stop-color="#6b4405" />
    </linearGradient>
    <linearGradient id="goldSpokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e599" />
      <stop offset="100%" stop-color="#a8761d" />
    </linearGradient>

    <!-- 3D Badge Gold Gradients -->
    <linearGradient id="badgePlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c281e" />
      <stop offset="50%" stop-color="#181611" />
      <stop offset="100%" stop-color="#0d0c09" />
    </linearGradient>
    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fced9f" />
      <stop offset="50%" stop-color="#b88320" />
      <stop offset="100%" stop-color="#eac665" />
    </linearGradient>
    <linearGradient id="text3dGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fbeba2" />
      <stop offset="70%" stop-color="#d6a031" />
      <stop offset="100%" stop-color="#8a5c10" />
    </linearGradient>

    <!-- Jewel Gradients -->
    <radialGradient id="sapphireGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#7ad2ff" />
      <stop offset="20%" stop-color="#2b93e8" />
      <stop offset="55%" stop-color="#1162b8" />
      <stop offset="85%" stop-color="#093f85" />
      <stop offset="100%" stop-color="#042252" />
    </radialGradient>
    <radialGradient id="jewelInnerGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Room Grid / Spatial Gradient -->
    <radialGradient id="roomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b3b55" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#141c2b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filters -->
    <filter id="keyShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="badgeShadow" x="-25%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- 3D Room Background Lighting / Subtle Vignette -->
  <circle cx="256" cy="256" r="230" fill="url(#roomGlow)" />

  <!-- 3D Spatial Wireframe Cube (Representing the 3D Mystery Room / Space) -->
  <g stroke="#6ca8e8" stroke-width="1.2" stroke-opacity="0.18" fill="none">
    <!-- Back Cube Face -->
    <polygon points="190,130 330,130 330,270 190,270" stroke-dasharray="4 4" />
    <!-- Depth Lines connecting Front and Back -->
    <line x1="130" y1="180" x2="190" y2="130" />
    <line x1="370" y1="180" x2="330" y2="130" />
    <line x1="370" y1="380" x2="330" y2="270" />
    <line x1="130" y1="380" x2="190" y2="270" />
    <!-- Front Cube Face (Perspective Room Outline) -->
    <polygon points="130,180 370,180 370,380 130,380" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- Floor Grid / Perspective Depth -->
    <line x1="130" y1="380" x2="256" y2="460" stroke-opacity="0.12" />
    <line x1="370" y1="380" x2="256" y2="460" stroke-opacity="0.12" />
    <line x1="250" y1="380" x2="256" y2="460" stroke-opacity="0.1" />
  </g>

  <!-- Inner Stitching Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#756b56" stroke-opacity="0.32" stroke-width="2.5" stroke-dasharray="8 6" />

  <!-- Inner Subtle Bevel -->
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Golden Key with Dramatic 3D Floating Shadow -->
  <g filter="url(#keyShadow)">
    <g transform="translate(182, 182) rotate(45)">

      <!-- Key Shaft -->
      <path d="M -9.5,30 L 9.5,30 L 9.5,215 A 9.5,9.5 0 0,1 -9.5,215 Z" fill="url(#goldShaftGrad)" />
      
      <!-- Shaft Tip Loop Accent -->
      <circle cx="0" cy="226" r="14" fill="url(#goldBowGrad)" />
      <circle cx="0" cy="226" r="6" fill="#141518" />

      <!-- Key Bit (Teeth) with 3D Depth -->
      <g fill="url(#goldBowGrad)">
        <rect x="8" y="145" width="28" height="15" rx="3" />
        <rect x="8" y="172" width="22" height="15" rx="3" />
        <path d="M 28,145 L 36,145 L 36,160 L 28,160 Z" fill="url(#goldShaftGrad)" />
        <path d="M 22,172 L 30,172 L 30,187 L 22,187 Z" fill="url(#goldShaftGrad)" />
      </g>

      <!-- Key Bow (Outer Ring) -->
      <circle cx="0" cy="0" r="69" fill="url(#goldBowGrad)" stroke="#7a5009" stroke-width="2" />
      <circle cx="0" cy="0" r="51" fill="#141518" />

      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="49" fill="none" stroke="url(#goldBowGrad)" stroke-width="6" />

      <!-- Cross Spokes -->
      <rect x="-4.5" y="-69" width="9" height="138" rx="2" fill="url(#goldSpokeGrad)" />
      <rect x="-69" y="-4.5" width="138" height="9" rx="2" fill="url(#goldSpokeGrad)" />

      <!-- Center Gem Bezel -->
      <circle cx="0" cy="0" r="33" fill="url(#goldBowGrad)" stroke="#5e3e04" stroke-width="2" />

      <!-- Sapphire Cabochon Gem -->
      <circle cx="0" cy="0" r="27" fill="url(#sapphireGrad)" />
      
      <!-- Gem Highlight (Glossy 3D Reflection) -->
      <ellipse cx="-8.5" cy="-8.5" rx="11" ry="7.5" transform="rotate(-30 -8.5 -8.5)" fill="url(#jewelInnerGlow)" />
      <circle cx="-10.5" cy="-10.5" r="3.5" fill="#ffffff" fill-opacity="0.85" />
      
      <!-- Gem Subtle Rim Reflection -->
      <path d="M -17,15 A 24,24 0 0,0 19,15" fill="none" stroke="#7ad2ff" stroke-opacity="0.35" stroke-width="2" />

    </g>
  </g>

  <!-- ============================================== -->
  <!-- 3D EMBLEM BADGE (Top Right Corner)              -->
  <!-- ============================================== -->
  <g filter="url(#badgeShadow)" transform="translate(350, 68)">
    <!-- Metallic Gold Outer Pill Badge -->
    <rect x="0" y="0" width="102" height="52" rx="26" fill="url(#badgePlateGrad)" stroke="url(#badgeBorderGrad)" stroke-width="3.5" />
    <!-- Inner Fine Inset Border -->
    <rect x="4" y="4" width="94" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    
    <!-- "3D" Typography -->
    <g filter="url(#textGlow)">
      <text x="51" y="37" 
            text-anchor="middle" 
            font-family="'Share Tech Mono', 'Arial Black', sans-serif" 
            font-size="34" 
            font-weight="900" 
            letter-spacing="2"
            fill="url(#text3dGrad)">3D</text>
    </g>
  </g>

</svg>